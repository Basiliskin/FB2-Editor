buildscript {
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
    plugins.withId('com.android.application') {
        android {
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
    }
    plugins.withId('com.android.library') {
        android {
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
    }
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions.jvmTarget = '17'
    }
}

project(':flutter_archive') {
    afterEvaluate {
        android {
            namespace 'com.kineapps.flutterarchive'
        }
    }
}

project(':flutter_file_dialog') {
    afterEvaluate {
        android {
            namespace 'com.kineapps.flutter_file_dialog'
        }
    }
}

project(':permission_handler_android') {
    afterEvaluate {
        android {
            namespace 'com.baseflow.permissionhandler'
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
